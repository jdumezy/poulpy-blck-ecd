name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-14
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo test --release --locked --features ref
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --features test-utils -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --features test-utils
      - run: cargo package --locked

  x86-backends:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C target-feature=+avx2,+fma,+avx512f,+avx512ifma,+avx512vl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-14
          targets: x86_64-unknown-linux-gnu
      - run: cargo check --release --locked --target x86_64-unknown-linux-gnu --all-targets --features all-x86-backends
